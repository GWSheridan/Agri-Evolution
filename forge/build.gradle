plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '7.0.40'
}

group = mod_group_id
version = mod_version
base { archivesName = "${mod_id}-${minecraft_version}-forge" }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets.main {
    java.srcDir project(':common').file('src/main/java')
    resources.srcDirs project(':common').file('src/main/resources'), project(':common').file('src/generated/resources')
}

def devModDirectory = layout.buildDirectory.dir('development-mod')
def compiledClasses = tasks.named('compileJava', JavaCompile)
def processedResources = tasks.named('processResources', ProcessResources)
processedResources.configure { destinationDir = layout.buildDirectory.dir('processed-mod-resources').get().asFile }
def prepareDevMod = tasks.register('prepareDevMod', Sync) {
    from compiledClasses.flatMap { it.destinationDirectory }
    from processedResources.map { it.destinationDir }
    into devModDirectory
}
// The Forge 1.21.1 development launcher scans the classes and descriptor together.
sourceSets.main.output.classesDirs.setFrom(devModDirectory)
sourceSets.main.output.classesDirs.builtBy(prepareDevMod)
sourceSets.main.output.resourcesDir = devModDirectory.get().asFile

minecraft {
    mappings channel: 'official', version: minecraft_version
    runs {
        configureEach {
            workingDir = layout.buildDirectory.dir("runs/${name}")
        }
        register('client')
        register('server') { args '--nogui' }
        register('gameTestServer') { systemProperty 'forge.enabledGameTestNamespaces', mod_id }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
    maven { url = 'https://maven.blamejared.com'; content { includeGroup 'mezz.jei' } }
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
    compileOnly 'mezz.jei:jei-1.21.1-common-api:19.51.0.418'
    if (project.hasProperty('withJei')) runtimeOnly 'mezz.jei:jei-1.21.1-forge:19.51.0.418'
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.matching { it.name in ['runClient', 'runServer', 'runGameTestServer'] }.configureEach {
    dependsOn prepareDevMod
}
tasks.withType(ProcessResources).configureEach {
    def metadata = [mod_id: mod_id, mod_version: mod_version, mod_name: mod_name,
                    mod_license: mod_license, forge_version: forge_version, minecraft_version: minecraft_version]
    inputs.properties metadata
    filesMatching('META-INF/mods.toml') { expand metadata }
}
tasks.named('jar') { from rootProject.file('LICENSE') }
