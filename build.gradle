plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.107'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    maven {
        url = 'https://maven.blamejared.com'
        content { includeGroup 'mezz.jei' }
    }
}

dependencies {
    compileOnly 'mezz.jei:jei-1.21.1-common-api:19.51.0.418'
    if (project.hasProperty('withJei')) runtimeOnly 'mezz.jei:jei-1.21.1-neoforge:19.51.0.418'
}

// Opt-in, world-free visual QA; never included in the release JAR.
sourceSets { guiPreview { compileClasspath += sourceSets.main.output; runtimeClasspath += sourceSets.main.output } }
configurations.guiPreviewRuntimeOnly.extendsFrom(configurations.runtimeOnly)

neoForge {
    version = neo_version

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        agri_evolution {
            sourceSet sourceSets.main
            if (project.hasProperty('gameplayTests')) sourceSet sourceSets.test
            if (project.hasProperty('guiPreview')) sourceSet sourceSets.guiPreview
        }
    }
}

// Opt-in real-server tests run in a separate disposable world, never the gameplay save.
neoForge.addModdingDependenciesTo(sourceSets.test)
neoForge.addModdingDependenciesTo(sourceSets.guiPreview)
if (project.hasProperty('guiPreview')) {
    neoForge.runs {
        guiPreview {
            client()
            sourceSet = sourceSets.guiPreview
            gameDirectory = file('build/gui-preview-run')
            if (project.hasProperty('withJei')) systemProperty 'agri.requireJei', 'true'
            if (project.hasProperty('irrigationPreview')) systemProperty 'agri.irrigationPreview', 'true'
            if (project.hasProperty('farmlandPreview')) systemProperty 'agri.farmlandPreview', 'true'
            if (project.hasProperty('basinPreview')) systemProperty 'agri.basinPreview', 'true'
            if (project.hasProperty('reservoirPreview')) systemProperty 'agri.reservoirPreview', 'true'
            if (project.hasProperty('foodPreview')) systemProperty 'agri.foodPreview', 'true'
            if (project.hasProperty('cookingPreview')) systemProperty 'agri.cookingPreview', 'true'
            if (project.hasProperty('cropPreview')) systemProperty 'agri.cropPreview', 'true'
            if (project.hasProperty('grandmasPreview')) systemProperty 'agri.grandmasPreview', 'true'
            if (project.hasProperty('journalIndexPreview')) systemProperty 'agri.journalIndexPreview', 'true'
            if (project.hasProperty('plannerPreview')) systemProperty 'agri.plannerPreview', 'true'
            if (project.hasProperty('nativeBreedingPreview')) systemProperty 'agri.nativeBreedingPreview', 'true'
            if (project.hasProperty('verticalGreenhousePreview')) systemProperty 'agri.verticalGreenhousePreview', 'true'
            if (project.hasProperty('gardenProgressionPreview')) systemProperty 'agri.gardenProgressionPreview', 'true'
            if (project.hasProperty('greenhouseStickPreview')) systemProperty 'agri.greenhouseStickPreview', 'true'
            if (project.hasProperty('stickPreview')) systemProperty 'agri.stickPreview', 'true'
            if (project.hasProperty('lunchControlsPreview')) systemProperty 'agri.lunchControlsPreview', 'true'
            if (project.hasProperty('selectivePlantingPreview')) systemProperty 'agri.selectivePlantingPreview', 'true'
            if (project.hasProperty('machinePreview')) systemProperty 'agri.machinePreview', 'true'
            if (project.hasProperty('update134Preview')) systemProperty 'agri.update134Preview', 'true'
            programArguments.addAll('--width', '1024', '--height', '576')
        }
    }
}
if (project.hasProperty('gameplayTests')) {
    neoForge.runs {
        gameplayTests {
            type = 'gameTestServer'
            sourceSet = sourceSets.test
            gameDirectory = file('build/gameplay-test-run')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'agri_evolution'
            if (project.hasProperty('profileAudit')) jvmArgument "-XX:StartFlightRecording=settings=profile,dumponexit=true,filename=${file('build/gameplay-test-run/gameplay.jfr').absolutePath}"
        }
    }
}

// Archived texture libraries and their notice stay out of generated resources and release JARs.
def legacyTextureEntries = [
    'assets/agri_evolution/textures/plant/**',
    'assets/agri_evolution/textures/seed/**',
    'assets/agri_evolution/textures/THIRD_PARTY_TEXTURE_LICENSE.txt'
]

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude legacyTextureEntries
}

tasks.register('verifyLegacyTextureExclusion') {
    group = 'verification'
    dependsOn tasks.named('jar')
    doLast {
        def forbidden = zipTree(tasks.named('jar').get().archiveFile.get().asFile).matching {
            include legacyTextureEntries
        }
        if (!forbidden.isEmpty()) throw new GradleException('Archived texture files found in the JAR')
        logger.lifecycle('Agri Evolution: archived texture libraries and notice excluded from distribution')
    }
}
tasks.named('check') { dependsOn tasks.named('verifyLegacyTextureExclusion') }

tasks.register('verifyGardenGui') {
    group = 'verification'
    doLast {
        def root = file('src/main/resources/assets/agri_evolution/textures/gui/garden')
        ['garden_frame':64, 'garden_header':64, 'seed_tray_slot':18].each { name, size ->
            def png = new File(root, name + '.png')
            def image = javax.imageio.ImageIO.read(png)
            if (image == null || image.width != size || image.height != size)
                throw new GradleException("Invalid garden GUI sprite: ${name}")
            def metadata = new groovy.json.JsonSlurper().parse(new File(root, name + '.png.mcmeta'))
            if (metadata.texture.blur != false) throw new GradleException("Garden GUI blur enabled: ${name}")
        }
        def client = file('src/main/java/com/agrievolution/client')
        ['SeedBagScreen', 'analyzer/SeedAnalyzerScreen', 'breeding/SeedBreedingStationScreen',
         'laboratory/BotanicalGeneticsLaboratoryScreen', 'soil/SoilResearchTableScreen', 'soil/SoilSamplerScreen',
         'greenhouse/BotanicalGreenhouseScreen', 'greenhouse/BotanicalGreenhouseHarvestScreen',
         'greenhouse/BotanicalGreenhouseSeedBankScreen', 'greenhouse/BotanicalGreenhouseStorageScreen',
         'journal/JournalRenderer'].each { name ->
            if (!new File(client,name+'.java').text.contains('GardenGuiTheme'))
                throw new GradleException("Screen missing gardening theme: ${name}")
        }
        logger.lifecycle('Agri Evolution: gardening theme connected to all 11 screens; native GUI assets verified')
    }
}
tasks.named('processResources') { dependsOn tasks.named('verifyGardenGui') }

tasks.named('jar', Jar) {
    exclude legacyTextureEntries
    from(layout.projectDirectory.file('LICENSE'))
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
        minecraft_version: minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version: neo_version,
        loader_version_range: loader_version_range,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_license: mod_license,
        mod_version: mod_version
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}


// Validate crop models and the *block-atlas* texture files. A PNG in textures/plant/
// is not enough: vanilla Minecraft's block atlas discovers textures/block/.
tasks.register('verifyCropTextures') {
    group = 'verification'
    description = 'Validate that all eight Agri Evolution crop models reference usable 64x64 block atlas PNGs.'
    doLast {
        def assetRoot = file('src/main/resources/assets/agri_evolution')
        def jsonParser = new groovy.json.JsonSlurper()
        def blockstates = jsonParser.parse(new File(assetRoot, 'blockstates/agri_crop.json'))
        (0..7).each { age ->
            def modelName = "agri_crop_stage${age}"
            def modelId = "agri_evolution:block/${modelName}"
            def modelFile = new File(assetRoot, "models/block/${modelName}.json")
            def textureFile = new File(assetRoot, "textures/block/${modelName}.png")
            if (!modelFile.isFile()) throw new GradleException("Missing crop model: ${modelFile}")
            if (!textureFile.isFile()) throw new GradleException("Missing BLOCK ATLAS texture: ${textureFile}")
            def model = jsonParser.parse(modelFile)
            if (model.parent != 'agri_evolution:block/crop_cross' || model.textures.crop != modelId) {
                throw new GradleException("Wrong parent or crop texture reference in ${modelFile}")
            }
            if (blockstates.multipart?.find { it.when?.age == "${age}" }?.apply?.model != modelId) {
                throw new GradleException("Broken blockstate age=${age} model mapping")
            }
            def image = javax.imageio.ImageIO.read(textureFile)
            if (image == null || image.width != 64 || image.height != 64 || !image.colorModel.hasAlpha()) {
                throw new GradleException("Crop stage must be a 64x64 RGBA PNG: ${textureFile.name}")
            }
            def signature = textureFile.withInputStream { ins ->
                byte[] bytes = new byte[8]
                if (ins.read(bytes) != 8) throw new GradleException("Invalid PNG header: ${textureFile}")
                bytes
            }
            if (!java.util.Arrays.equals(signature, [(byte)137, (byte)80, (byte)78, (byte)71, (byte)13, (byte)10, (byte)26, (byte)10] as byte[])) {
                throw new GradleException("Not a PNG: ${textureFile}")
            }
        }
        logger.lifecycle('Agri Evolution: validated all 8 crop stages and 64x64 block atlas PNGs')
    }
}

tasks.named('processResources') {
    dependsOn(tasks.named('verifyCropTextures'))
}

// 0.32.0: enforce a unified 64x64 standard for block/crop textures so future art stays consistent.
tasks.register('verifyBlockTextureStandard') {
    group = 'verification'
    description = 'Check block texture sizes and crop sprite contact with farmland.'
    doLast {
        def assets = file('src/main/resources/assets/agri_evolution')
        def models = new File(assets, 'models/block')
        def parser = new groovy.json.JsonSlurper()
        def cropPlanes = parser.parse(new File(models, 'crop_cross.json')).elements
        def soilTops = models.listFiles().findAll { it.name ==~ /.+_farmland_(wet|dry)\.json/ }.collect { model ->
            parser.parse(model).elements.collect { it.to[1] }.max()
        }
        def soilSurface = (soilTops + [15]).min() - 16
        def files = new File(assets, 'textures/block').listFiles().findAll { it.name.endsWith('.png') }.sort { a, b -> a.name <=> b.name }
        int cropStages = 0
        files.each { file ->
            def image = javax.imageio.ImageIO.read(file)
            if (image == null || image.width != 64 || image.height != 64)
                throw new GradleException("Block texture must be 64x64: ${file.name}")
            if (file.name ==~ /.+_crop_stage[0-7]\.png/) {
                // Minecraft's cutout shader discards alpha below 0.1.
                def bottom = (63..0).find { y -> (0..63).any { x -> (image.getRGB(x, y) >>> 24) >= 26 } }
                if (bottom == null || cropPlanes.any { plane ->
                    plane.from[1] + (63 - bottom) * (plane.to[1] - plane.from[1]) / 64 > soilSurface
                }) {
                    throw new GradleException("Crop sprite does not reach farmland: ${file.name}")
                }
                cropStages++
            }
        }
        logger.lifecycle("Agri Evolution: verified ${files.size()} unified 64x64 block textures")
        logger.lifecycle("Agri Evolution: all ${cropStages} crop sprites reach farmland")
    }
}
tasks.named('processResources') { dependsOn(tasks.named('verifyBlockTextureStandard')) }

tasks.named('test', Test) {
    // Project currently has skeleton test sources but no test engine/discoverable tests.
    failOnNoDiscoveredTests = false
}


// Verify crisp item sprites: every generated inventory item now follows one 64x64 standard.
// This prevents a repeat of mixed 16/32/64 sizing, halo artifacts and mismatched inventory art.
tasks.register('verifyItemTextures') {
    group = 'verification'
    description = 'Check every generated Agri Evolution item texture for the 64x64 standard and crisp binary alpha.'
    doLast {
        def root = file('src/main/resources/assets/agri_evolution')
        def parser = new groovy.json.JsonSlurper()
        def modelFiles = file('src/main/resources/assets/agri_evolution/models/item')
                .listFiles().findAll { it.name.endsWith('.json') }.sort { a, b -> a.name <=> b.name }
        def ids = [] as Set
        modelFiles.each { modelFile ->
            def model = parser.parse(modelFile)
            def layer0 = model.textures?.layer0
            if (!(layer0 instanceof String) || !layer0.startsWith('agri_evolution:item/')) {
                return
            }
            if (!(model.parent in ['minecraft:item/generated', 'minecraft:item/handheld'])) {
                throw new GradleException("Invalid generated item model: ${modelFile.name}")
            }
            def id = layer0.substring('agri_evolution:item/'.length())
            ids << id
            def imageFile = new File(root, "textures/item/${id}.png")
            if (!imageFile.isFile()) {
                throw new GradleException("Missing Agri Evolution item texture: ${id}")
            }
            def image = javax.imageio.ImageIO.read(imageFile)
            if (image == null || image.width != 64 || image.height != 64) {
                throw new GradleException("Item PNG must be 64x64: ${id}")
            }
            boolean transparent = false
            boolean opaque = false
            for (int y = 0; y < image.height; y++) {
                for (int x = 0; x < image.width; x++) {
                    int alpha = (image.getRGB(x, y) >>> 24) & 0xFF
                    if (alpha == 0) transparent = true
                    else if (alpha == 255) opaque = true
                    else throw new GradleException("Unwanted semi-transparent fringe in ${id}.png at ${x},${y}")
                }
            }
            if (!transparent || !opaque) {
                throw new GradleException("Item sprite needs visible pixels and genuine transparency: ${id}")
            }
        }
        logger.lifecycle("Agri Evolution: verified ${ids.size()} crisp 64x64 item sprites and model references")
    }
}

tasks.named('processResources') {
    dependsOn(tasks.named('verifyItemTextures'))
}

// The plain Java genetics self-test requires no JUnit or in-game launcher.
tasks.register('genomeSelfTest', JavaExec) {
    group = 'verification'
    description = 'Run deterministic genetics/mutation/clamping checks.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.agrievolution.genetics.GenomeSmokeTest'
}

// Prevent a repeat of the broken crop and inventory textures.
tasks.register('verifyWorkingTextures') {
    group = 'verification'
    description = 'Check crop and item sprite SHA-256 fingerprints when the local baseline is available.'
    def baseline = layout.projectDirectory.file('WORKING_TEXTURE_SHA256.json').asFile
    onlyIf('the local texture baseline is available') { baseline.isFile() }
    doLast {
        def hashes = new groovy.json.JsonSlurper().parse(baseline)
        hashes.each { path, expected ->
            def fileToCheck = file("src/main/resources/assets/agri_evolution/${path}")
            if (!fileToCheck.isFile()) throw new GradleException("Missing working texture: ${path}")
            def digest = java.security.MessageDigest.getInstance('SHA-256')
            def actual = digest.digest(fileToCheck.bytes).encodeHex().toString()
            if (actual != expected) throw new GradleException("Working texture modified: ${path}")
        }
        logger.lifecycle("Agri Evolution: ${hashes.size()} known-good texture checksums verified (original 64px item baselines)")
    }
}
tasks.named('processResources') { dependsOn(tasks.named('verifyWorkingTextures')) }

// Agri Evolution 0.4: verify all new species resources and icon transparency.
tasks.register('verifySpeciesResources') {
    group = 'verification'
    description = 'Check all species crop stages, blockstates, loot tables and 64x64 seed icons.'
    doLast {
        def root = file('src/main/resources/assets/agri_evolution')
        def data = file('src/main/resources/data/agri_evolution/loot_table/blocks')
        def parser = new groovy.json.JsonSlurper()
        ['crimson_clover', 'azure_flax', 'violet_starflower', 'amber_marigold', 'silver_thistle', 'sunfire_lily', 'moon_orchid'].each { id ->
            def blockId = "${id}_crop"
            def seedId = "${id}_seed"
            def states = parser.parse(new File(root, "blockstates/${blockId}.json"))
            (0..7).each { age ->
                def name = "${blockId}_stage${age}"
                def modelId = "agri_evolution:block/${name}"
                def model = parser.parse(new File(root, "models/block/${name}.json"))
                if (states.multipart?.find { it.when?.age == "${age}" }?.apply?.model != modelId ||
                    model.parent != 'agri_evolution:block/crop_cross' ||
                    model.textures?.crop != modelId ||
                    model.render_type != 'minecraft:cutout') {
                    throw new GradleException("Invalid growth stage ${age} for ${blockId}")
                }
                def image = javax.imageio.ImageIO.read(new File(root, "textures/block/${name}.png"))
                if (image == null || image.width != 64 || image.height != 64 ||
                    !image.colorModel.hasAlpha()) {
                    throw new GradleException("Invalid 64x64 crop sprite ${name}")
                }
            }
            def model = parser.parse(new File(root, "models/item/${seedId}.json"))
            if (model.parent != 'minecraft:item/generated' ||
                model.textures?.layer0 != "agri_evolution:item/${seedId}") {
                throw new GradleException("Invalid seed item model for ${seedId}")
            }
            def image = javax.imageio.ImageIO.read(new File(root, "textures/item/${seedId}.png"))
            if (image == null || image.width != 64 || image.height != 64) {
                throw new GradleException("Invalid seed icon ${seedId}")
            }
            def loot = parser.parse(new File(data, "${blockId}.json"))
            if (loot.type != 'minecraft:block') {
                throw new GradleException("Invalid loot table ${blockId}")
            }
        }
        logger.lifecycle('Agri Evolution: verified all 7 non-wild species, 56 64x64 crop stages, and 7 seed icons')
    }
}

tasks.named('processResources') { dependsOn(tasks.named('verifySpeciesResources')) }


// 0.5.1: the four new flowers must look like plants, not filled square blocks.
// PNG validation is intentionally independent of Python or Pillow.
tasks.register('verifyBotanicalSilhouettes') {
    group = 'verification'
    description = 'Verify all 312 redrawn crop growth sprites, cutout edges and growth alignment.'
    doLast {
        def base = file('src/main/resources/assets/agri_evolution/textures/block')
        ['agri', 'crimson_clover', 'azure_flax', 'violet_starflower', 'amber_marigold',
         'silver_thistle', 'sunfire_lily', 'moon_orchid', 'eclipse_lotus', 'twilight_sage',
         'dirt', 'wood', 'stone', 'coal', 'copper', 'iron', 'redstone', 'gold', 'lapis',
         'diamond', 'emerald', 'quartz', 'gravel', 'sand', 'clay', 'flint', 'glowstone',
         'obsidian', 'netherrack', 'soul_sand', 'magma_cream', 'nether_wart', 'blaze_rod',
         'end_stone', 'chorus_fruit', 'ender_pearl', 'shulker_shell', 'ancient_debris', 'netherite'].each { species ->
            def seen = new HashSet<String>()
            int previousTop = 64
            (0..7).each { age ->
                def path = new File(base, "${species}_crop_stage${age}.png")
                def im = javax.imageio.ImageIO.read(path)
                if (im == null || im.width != 64 || im.height != 64 || !im.colorModel.hasAlpha()) {
                    throw new GradleException("Invalid 64x64 RGBA crop PNG ${path.name}")
                }
                def count = 0
                def top = 64
                for (int y=0; y<64; y++) {
                    for (int x=0; x<64; x++) {
                        int alpha = (im.getRGB(x,y) >>> 24) & 0xff
                        if (alpha != 0 && alpha != 255) throw new GradleException("Partially transparent crop pixel in ${path.name}")
                        if (alpha > 0) {
                            count++; top = Math.min(top, y)
                            if (x < 7 || x > 56 || y == 63) throw new GradleException("Crop exceeds its 50px planting footprint: ${path.name}")
                        }
                    }
                }
                // 0.37 crop redraw: fuller foliage while retaining open space and clear edges.
                if (count < 64 || count > 2000 || top < 8) throw new GradleException("Oversized/empty crop: ${path.name} (${count} pixels; top=${top})")
                if (top > previousTop) throw new GradleException("Crop shrinks between growth stages: ${path.name}")
                previousTop = top
                def fingerprint = java.security.MessageDigest.getInstance('SHA-256').digest(path.bytes).encodeHex().toString()
                if (!seen.add(fingerprint)) throw new GradleException("Repeated growth artwork: ${path.name}")
            }
        }
        logger.lifecycle('Agri Evolution: 312 crop growth sprites, transparent margins and growth progression verified')
    }
}
tasks.named('processResources') { dependsOn tasks.named('verifyBotanicalSilhouettes') }

tasks.register('speciesSelfTest', JavaExec) {
    group = 'verification'
    description = 'Run deterministic crop-species inheritance and mutation tests.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.agrievolution.genetics.SpeciesSmokeTest'
