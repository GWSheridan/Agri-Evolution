// 0.32.2: future-proof the texture pipeline. Standalone gameplay icons/tiles are
// 64x64; vertical animation strips consist of successive 64x64 frames.
// Native-resolution GUI panels and entity skins are intentionally *not* resized:
// their pixel/UV coordinates would otherwise require corresponding renderer changes.
tasks.register('verifyTextureCatalog0322') {
    group = 'verification'
    description = 'Verify 64px item, block, seed and plant texture frames, with no partial-alpha fringes on standalone sprites.'
    doLast {
        def root = file('src/main/resources/assets/agri_evolution/textures')
        int sprites = 0
        int strips = 0
        ['block', 'item'].each { category ->
            fileTree(new File(root, category)) { include '**/*.png' }.files.each { tex ->
                def image = javax.imageio.ImageIO.read(tex)
                if (image == null || image.width != 64 || image.height < 64 || (image.height % 64) != 0) {
                    throw new GradleException("Texture must contain 64x64 frame(s): ${category}/${tex.name}")
                }
                if (category == 'block' && image.height != 64) {
                    throw new GradleException("Block tile must be exactly 64x64: ${tex.name}")
                }
                if (category == 'seed' && image.height != 64) {
                    throw new GradleException("Seed icon must be exactly 64x64: ${tex.name}")
                }
                if (image.height > 64) strips++
                else sprites++
                // Standalone inventory sprites and seed art must have clean cutout edges.
                if (image.height == 64 && (category == 'item' || category == 'seed')) {
                    for (int y=0; y<64; y++) {
                        for (int x=0; x<64; x++) {
                            int a = (image.getRGB(x,y) >>> 24) & 255
                            if (a != 0 && a != 255)
                                throw new GradleException("Semi-transparent fringe: ${category}/${tex.name} (${x},${y})")
                        }
                    }
                }
            }
        }
        // Check every explicit Agri Evolution model texture reference for a PNG.
        def parser = new groovy.json.JsonSlurper()
        def modelRoot = file('src/main/resources/assets/agri_evolution/models')
        int refs = 0
        fileTree(modelRoot) { include '**/*.json' }.files.each { modelFile ->
            def model = parser.parse(modelFile)
            (model.textures ?: [:]).values().each { ref ->
                if (ref instanceof String && ref.startsWith('agri_evolution:')) {
                    def path = ref.substring('agri_evolution:'.length())
                    def image = new File(root, path + '.png')
                    if (!image.isFile()) throw new GradleException("Missing model texture ${ref} in ${modelFile.name}")
                    refs++
                }
            }
        }
        logger.lifecycle("Agri Evolution: ${sprites} standalone 64px sprites, ${strips} preserved 64px-frame strips, ${refs} model references verified")
        logger.lifecycle('Native GUI sheets are checked separately; retired assets are archived outside active resources.')
    }
}
tasks.named('processResources') { dependsOn(tasks.named('verifyTextureCatalog0322')) }

tasks.register('verifyRecipeCatalogue', Exec) {
    group = 'verification'
    description = 'Check the illustrated machine recipe catalogue against crafting recipes.'
    commandLine 'node', 'tools/build_machine_recipe_catalog.cjs', '--check'
}

tasks.register('verifyMod') {
    group = 'verification'
    description = 'Build the mod and run all automated checks. Requires -PgameplayTests and Node.js.'
    dependsOn 'build', 'compileGuiPreviewJava', 'verifyRecipeCatalogue',
            'genomeSelfTest', 'speciesSelfTest', 'farmingSelfTest', 'seedAnalyzerSelfTest',
            'breedingStationSelfTest', 'resourceProgressionSelfTest', 'seedBankPlannerSelfTest',
            'smartGreenhouseMonitoringSelfTest', 'harvestExportPolicySelfTest', 'journalNavigationSelfTest'
    if (project.hasProperty('gameplayTests')) dependsOn 'runGameplayTests'
    doFirst {
        if (!project.hasProperty('gameplayTests'))
            throw new GradleException('Use -PgameplayTests verifyMod to include the server gameplay tests.')
    }
}

