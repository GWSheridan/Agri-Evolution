// Agri Evolution 0.4.2: check the new pixel-art GUI and every 32x32 icon.
// Does not touch, regenerate or re-encode any working crop or item texture.
tasks.register('verifyJournalUI') {
    group = 'verification'
    description = 'Validate journal GUI sprite sizes, PNGs and species IDs.'
    doLast {
        def root = file('src/main/resources/assets/agri_evolution/textures/gui/journal')
        def expected = [
            'journal_background.png': [430, 270],
            'journal_background_compact.png': [380, 204],
            'arrow_left.png': [20, 20],
            'arrow_right.png': [20, 20]
        ]
        ['undiscovered'].each {
            expected["species/${it}.png"] = [32, 32]
            expected["species/small/${it}.png"] = [16, 16]
        }
        expected.each { path, dimensions ->
            def imageFile = new File(root, path)
            def image = javax.imageio.ImageIO.read(imageFile)
            if (image == null || image.width != dimensions[0] || image.height != dimensions[1]
                    || !image.colorModel.hasAlpha()) {
                throw new GradleException("Missing/invalid GUI PNG: ${path} must be ${dimensions[0]}x${dimensions[1]} RGBA")
            }
        }
        logger.lifecycle("Agri Evolution: verified ${expected.size()} crisp journal GUI textures (full + compact)")
    }
}
tasks.named('processResources') { dependsOn(tasks.named('verifyJournalUI')) }

tasks.register('journalNavigationSelfTest', JavaExec) {
    group = 'verification'
    description = 'Run independent journal tab/species navigation checks.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.agrievolution.client.journal.JournalNavigationSelfTest'
}

// 0.4.4: enforce a blur-before-UI render order and pixel-perfect native art layouts.
tasks.register('verifyJournalPixelPerfect') {
    group = 'verification'
    description = 'Protect against fractional journal pose scaling and blurred UI assets.'
    dependsOn tasks.named('verifyJournalUI')
    doLast {
        def screen = file('src/main/java/com/agrievolution/client/journal/JournalScreen.java').text
        if (screen.contains('gui.pose().scale(uiScale') || screen.contains('uiScale = Math.min')) {
            throw new GradleException('Fractional JournalScreen scale reintroduced')
        }
        if (!screen.contains('CompactJournalRenderer.render') || !screen.contains('compact = width <')) {
            throw new GradleException('Missing native-resolution responsive journal layout')
        }
        // Minecraft 1.21.1 applies framebuffer blur in Screen.renderBackground().
        // Rendering the journal *before* super.render() blurs all its text and artwork.
        def start = screen.indexOf('public void render(GuiGraphics gui, int mouseX, int mouseY, float partialTick)')
        def finish = screen.indexOf('private void title(', start)
        if (start < 0 || finish < 0) throw new GradleException('JournalScreen.render() missing')
        def renderBody = screen.substring(start, finish)
        def backgroundFirst = renderBody.indexOf('super.render(gui, mouseX, mouseY, partialTick);')
        def journalDrawing = renderBody.indexOf('gui.fill(0, 0, width, height, 0xB4000806);')
        if (backgroundFirst < 0 || journalDrawing < 0 || backgroundFirst > journalDrawing ||
                renderBody.indexOf('super.render(gui, mouseX, mouseY, partialTick);', backgroundFirst + 1) >= 0) {
            throw new GradleException('Journal blur regression: super.render() must run ONCE before all journal drawing')
        }
        def folder = file('src/main/resources/assets/agri_evolution/textures/gui/journal')
        def names = ['journal_background','journal_background_compact','arrow_left','arrow_right']
        names.each { name ->
            def f = new File(folder, "${name}.png.mcmeta")
            if (!f.isFile()) throw new GradleException("Missing sampling metadata for ${name}")
            def metadata = new groovy.json.JsonSlurper().parse(f)
            if (metadata.texture?.blur != false) {
                throw new GradleException("Blur must be disabled: ${name}")
            }
        }
        logger.lifecycle('Agri Evolution: native-resolution full/compact journal layouts checked')
    }
}
tasks.named('processResources') { dependsOn(tasks.named('verifyJournalPixelPerfect')) }


// 0.6.0: validates multipart crop supports and new irrigation resources.
tasks.register('verifyFarmResources') {
    group = 'verification'
    description = 'Check all 8 supported-crop blockstates, trellis/basin models, recipes and art.'
    doLast {
        def root = file('src/main/resources/assets/agri_evolution')
        def data = file('src/main/resources/data/agri_evolution')
        def parser = new groovy.json.JsonSlurper()
        def ids = ['agri_crop','crimson_clover_crop','azure_flax_crop','violet_starflower_crop',
                   'amber_marigold_crop','silver_thistle_crop','sunfire_lily_crop','moon_orchid_crop']
        ids.each { id ->
            def states = parser.parse(new File(root, "blockstates/${id}.json"))
            def parts = states.multipart
            if (!parts || parts.size() != 12) throw new GradleException("Missing multipart crop models: ${id}")
            if (parts.find { it.when?.weedy == 'true' }?.apply?.model != 'agri_evolution:block/crop_weeds')
                throw new GradleException("Missing weed overlay: ${id}")
            (0..7).each { age ->
                if (parts.find { it.when?.age == "${age}" }?.apply?.model !=
                    "agri_evolution:block/${id}_stage${age}")
                    throw new GradleException("Broken age=${age} for ${id}")
            }
            if (parts.find { it.when?.supported == 'true' && it.when?.support_tier == '0|1' }?.apply?.model !=
                'agri_evolution:block/crop_support_overlay')
                throw new GradleException("Missing support model for ${id}")
            [2:"iron",3:"obsidian"].each { tier, material ->
                if (parts.find { it.when?.supported == "true" && it.when?.support_tier == tier.toString() }?.apply?.model != "agri_evolution:block/${material}_crop_support_overlay")
                    throw new GradleException("Missing tier ${tier} support model for ${id}")
            }
        }
        // Validate all three visual tiers, each with empty and full water models.
        // The basin now has an upgrade blockstate property, so checking only
        // filled=false / filled=true is no longer sufficient.
        ['crop_support_overlay',
         'irrigation_basin_empty', 'irrigation_basin_full',
         'irrigation_basin_empty_mk2', 'irrigation_basin_full_mk2',
         'irrigation_basin_empty_mk3', 'irrigation_basin_full_mk3'].each { id ->
            def model = parser.parse(new File(root, "models/block/${id}.json"))
            if (!model.elements || model.elements.isEmpty())
                throw new GradleException("Missing 3D elements for ${id}")
            model.textures.each { name, texture ->
                def value = texture.replace('agri_evolution:block/', '')
                if (texture != "minecraft:block/water_still" && !new File(root, "textures/block/${value}.png").isFile())
                    throw new GradleException("Missing referenced texture: ${texture}")
            }
        }
        ['crop_support', 'irrigation_basin'].each { id ->
            if (!new File(data, "recipe/${id}.json").isFile())
                throw new GradleException("Missing survival recipe for ${id}")
            if (!new File(root, "models/item/${id}.json").isFile())
                throw new GradleException("Missing item model for ${id}")
        }
        def basinStates = parser.parse(new File(root, 'blockstates/irrigation_basin.json'))
        def expectedBasinStates = [
            'filled=false,upgrade=0': 'irrigation_basin_empty',
            'filled=true,upgrade=0' : 'irrigation_basin_full',
            'filled=false,upgrade=1': 'irrigation_basin_empty_mk2',
            'filled=true,upgrade=1' : 'irrigation_basin_full_mk2',
            'filled=false,upgrade=2': 'irrigation_basin_empty_mk3',
            'filled=true,upgrade=2' : 'irrigation_basin_full_mk3'
        ]
        expectedBasinStates.each { state, model ->
            if (basinStates.variants[state]?.model != "agri_evolution:block/${model}")
                throw new GradleException("Basin state ${state} missing its model: ${model}")
        }
        if (basinStates.variants.size() != expectedBasinStates.size())
            throw new GradleException('Basin has unexpected or duplicate variant states')
        logger.lifecycle('Agri Evolution: verified 8 supported crops, six basin states, 3D models, and crafting assets')
    }
}
