// 0.19.2: every AgriCropBlock creates AECropBlockEntity, so all crops MUST
// be valid for the stable agri_evolution:agri_crop block entity type.
// This guard runs on *compileJava*, not just processResources or clean build.
tasks.register('verifyCropBlockEntityRegistration') {
    group = 'verification'
    description = 'Prevent Invalid block entity crashes when planting new crop species.'
    doLast {
        def speciesSource = file('src/main/java/com/agrievolution/genetics/CropSpecies.java').text
        def blocksSource = file('src/main/java/com/agrievolution/content/AEBlocks.java').text
        def entitiesSource = file('src/main/java/com/agrievolution/content/AEBlockEntities.java').text
        def species = (speciesSource =~ /(?m)^\s*([A-Z][A-Z0-9_]*)\("[^"]+",\s*"[^"]+",\s*"[^"]+",\s*"[^"]+",\s*(?:true|false)\)[,;]/)
                .collect { it[1] }
        if (species.isEmpty()) throw new GradleException('CropSpecies registry was not parsed')
        def expected = species.collect { it == 'WILD' ? 'AGRI_CROP' : "${it}_CROP" }
        def defined = (blocksSource =~ /public static final DeferredBlock<AgriCropBlock>\s+([A-Z][A-Z0-9_]*)\s*=/)
                .collect { it[1] }
        def typeMatch = (entitiesSource =~ /(?s)AECropBlockEntity::new,\s*(.*?)\)\.build\(null\)/)
        if (!typeMatch.find()) throw new GradleException('AGRI_CROP BlockEntityType.Builder.of not found')
        def registered = (typeMatch.group(1) =~ /AEBlocks\.([A-Z][A-Z0-9_]*)\.get\(\)/)
                .collect { it[1] }
        if (defined.size() != defined.toSet().size() || registered.size() != registered.toSet().size())
            throw new GradleException('Duplicate crop block or BlockEntityType registration')
        def missingBlocks = expected.toSet() - defined.toSet()
        def extraneousBlocks = defined.toSet() - expected.toSet()
        def missingValid = expected.toSet() - registered.toSet()
        def extraValid = registered.toSet() - expected.toSet()
        if (missingBlocks || extraneousBlocks || missingValid || extraValid) {
            throw new GradleException("Crop registration mismatch: missing blocks=${missingBlocks}, extra blocks=${extraneousBlocks}, invalid BE blocks=${missingValid}, unexpected BE blocks=${extraValid}")
        }
        logger.lifecycle("Agri Evolution 0.20.0: ${expected.size()} crop blocks registered and valid for AECropBlockEntity")
    }
}
tasks.named('compileJava') { dependsOn tasks.named('verifyCropBlockEntityRegistration') }

