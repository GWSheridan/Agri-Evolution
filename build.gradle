plugins {
    id 'base'
}

tasks.named('build') {
    dependsOn ':common:check', ':neoforge:build', ':forge:build', ':fabric:build'
}

tasks.register('verifyMultiLoader') {
    group = 'verification'
    description = 'Build all distributions and run loader verification.'
    dependsOn 'verifyDistributions', ':neoforge:verifyMod'
}

tasks.register('verifyDistributions') {
    group = 'verification'
    description = 'Check shared resource coverage, branding and loader isolation in the three distribution JARs.'
    def platforms = [
            neoforge: 'META-INF/neoforge.mods.toml',
            forge: 'META-INF/mods.toml',
            fabric: 'fabric.mod.json'
    ]
    dependsOn ':common:check', ':neoforge:jar', ':forge:jar', ':fabric:remapJar'
    def jars = platforms.collectEntries { loader, metadata ->
        [loader, file("${loader}/build/libs/${mod_id}-${minecraft_version}-${loader}-${mod_version}.jar")]
    }
    inputs.files jars.values()
    doLast {
        Map<String, Long> sharedResources = null
        platforms.each { loader, metadata ->
            def jar = jars[loader]
            new java.util.zip.ZipFile(jar).withCloseable { zip ->
                def entries = zip.entries().toList()
                def names = entries.collect { it.name }
                if (names.count { it == metadata } != 1 || !names.contains('LICENSE')) {
                    throw new GradleException("Missing metadata or LICENSE in ${jar.name}")
                }
                def descriptor = zip.getInputStream(zip.getEntry(metadata)).getText('UTF-8')
                if (!descriptor.contains(mod_id) || !descriptor.contains(mod_version) || !descriptor.contains('GWSHERIDAN')) {
                    throw new GradleException("Incorrect mod ID, version or credits in ${jar.name}")
                }
                if (platforms.any { other, path -> other != loader && names.contains(path) }) {
                    throw new GradleException("Mixed loader metadata in ${jar.name}")
                }
                if (entries.any { entry ->
                    def name = entry.name
                    !entry.directory && (platforms.keySet().any { other ->
                        other != loader && (name.startsWith("com/agrievolution/${other}/") || name.startsWith("data/${other}/"))
                    } || name.startsWith('agri_evolution.fabric.') && loader != 'fabric')
                }) throw new GradleException("Another loader's resources found in ${jar.name}")
                def resources = entries.findAll { entry ->
                    !entry.directory && (entry.name.startsWith("assets/${mod_id}/")
                            || entry.name.startsWith("data/${mod_id}/") && !entry.name.contains('/loot_modifiers/'))
                }.collectEntries { [it.name, it.crc] }
                if (sharedResources == null) sharedResources = resources
                else if (resources != sharedResources) throw new GradleException("Shared assets or gameplay data differ in ${jar.name}")
            }
        }
    }
}

subprojects {
    tasks.withType(AbstractArchiveTask).configureEach {
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }
}
