plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.19.4'
}

group = mod_group_id
version = mod_version
base { archivesName = "${mod_id}-${minecraft_version}-fabric" }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets.main {
    java.srcDir project(':common').file('src/main/java')
    resources.srcDirs project(':common').file('src/main/resources'), project(':common').file('src/generated/resources')
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.blamejared.com'; content { includeGroup 'mezz.jei' } }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    modCompileOnly 'mezz.jei:jei-1.21.1-common-api:19.51.0.418'
    if (project.hasProperty('withJei')) modLocalRuntime 'mezz.jei:jei-1.21.1-fabric:19.51.0.418'
}

loom {
    accessWidenerPath = file('src/main/resources/agri_evolution.accesswidener')
    runs {
        client { runDir 'build/runs/client' }
        server { runDir 'build/runs/server' }
    }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.withType(ProcessResources).configureEach {
    def metadata = [mod_id: mod_id, mod_version: mod_version, mod_name: mod_name,
                    mod_license: mod_license, minecraft_version: minecraft_version,
                    fabric_loader_version: fabric_loader_version, fabric_api_version: fabric_api_version]
    inputs.properties metadata
    filesMatching('fabric.mod.json') { expand metadata }
}
tasks.named('jar') { from rootProject.file('LICENSE') }
